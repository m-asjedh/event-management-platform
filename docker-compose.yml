services:
  postgres:
    image: postgres:18
    container_name: emp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emp_password}
      POSTGRES_DB: ${POSTGRES_DB:-event_management_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 sets PGDATA to /var/lib/postgresql/18/docker and declares its
      # volume at the parent. Mount the parent and let the image create the
      # version subdirectory inside it. The pre-18 path (/var/lib/postgresql/data)
      # starts fine but writes to an anonymous volume, so the data disappears on
      # the next `docker compose down`.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-emp_user} -d ${POSTGRES_DB:-event_management_platform}
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot. Runs the migrations and exits, so it sits behind a profile and is started
  # by `make migrate` rather than by `docker compose up`.
  #
  # It exists as a container, not as a host command, because the setup is only allowed to
  # need Docker and make. Building the migrator here means the reviewer needs no Go
  # toolchain and no goose CLI.
  migrate:
    build: ./backend
    entrypoint: ["migrate"]
    environment:
      # `postgres`, not localhost: inside the compose network the database is reached by
      # service name.
      DATABASE_URL: postgres://${POSTGRES_USER:-emp_user}:${POSTGRES_PASSWORD:-emp_password}@postgres:5432/${POSTGRES_DB:-event_management_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data:
