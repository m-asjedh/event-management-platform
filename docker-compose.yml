services:
  postgres:
    image: postgres:18
    container_name: emp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emp_password}
      POSTGRES_DB: ${POSTGRES_DB:-event_management_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 sets PGDATA to /var/lib/postgresql/18/docker and declares its
      # volume at the parent. Mount the parent and let the image create the
      # version subdirectory inside it. The pre-18 path (/var/lib/postgresql/data)
      # starts fine but writes to an anonymous volume, so the data disappears on
      # the next `docker compose down`.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-emp_user} -d ${POSTGRES_DB:-event_management_platform}
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot. Runs the migrations and exits, so it sits behind a profile and is started
  # by `make migrate` rather than by `docker compose up`.
  #
  # It exists as a container, not as a host command, because the setup is only allowed to
  # need Docker and make. Building the migrator here means the reviewer needs no Go
  # toolchain and no goose CLI.
  migrate:
    build: ./backend
    entrypoint: ["migrate"]
    environment:
      # `postgres`, not localhost: inside the compose network the database is reached by
      # service name.
      DATABASE_URL: postgres://${POSTGRES_USER:-emp_user}:${POSTGRES_PASSWORD:-emp_password}@postgres:5432/${POSTGRES_DB:-event_management_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  seed:
    build: ./backend
    entrypoint: ["seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emp_user}:${POSTGRES_PASSWORD:-emp_password}@postgres:5432/${POSTGRES_DB:-event_management_platform}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  test:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emp_user}:${POSTGRES_PASSWORD:-emp_password}@postgres:5432/${POSTGRES_DB:-event_management_platform}?sslmode=disable
      # Not an event zone, so cross-zone tests fail if they use the machine TZ.
      TZ: Pacific/Auckland
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  lint:
    image: node:22-alpine
    working_dir: /spec
    volumes:
      - ./openapi:/spec
    command: ["npx", "--yes", "@redocly/cli", "lint", "openapi.yaml"]
    profiles: ["tools"]

  contract:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emp_user}:${POSTGRES_PASSWORD:-emp_password}@postgres:5432/${POSTGRES_DB:-event_management_platform}?sslmode=disable
      API_URL: http://api:8080
      OPENAPI_PATH: /spec/openapi.yaml
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-not-a-real-secret-000000000000}
      TZ: Pacific/Auckland
    volumes:
      - ./openapi:/spec:ro
    command: ["go", "test", "./internal/contract", "-count=1", "-timeout", "60s", "-v"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles: ["tools"]

  # Off-the-shelf auth. It reads and writes the tables in the `auth` schema that the
  # migrations created; it is never allowed to manage schema itself.
  auth:
    build: ./auth
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emp_user}:${POSTGRES_PASSWORD:-emp_password}@postgres:5432/${POSTGRES_DB:-event_management_platform}?sslmode=disable
      # Dev-only default so a clean clone starts with no .env. Override for anything real.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-not-a-real-secret-000000000000}
      BETTER_AUTH_URL: http://localhost:${AUTH_PORT:-3001}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:5173}
      AUTH_PORT: "3001"
    ports:
      - "${AUTH_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    entrypoint: ["api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-emp_user}:${POSTGRES_PASSWORD:-emp_password}@postgres:5432/${POSTGRES_DB:-event_management_platform}?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-not-a-real-secret-000000000000}
      API_PORT: "8080"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/healthz
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
