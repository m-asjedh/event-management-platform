services:
  postgres:
    image: postgres:18
    container_name: emp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emp_password}
      POSTGRES_DB: ${POSTGRES_DB:-event_management_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 sets PGDATA to /var/lib/postgresql/18/docker and declares its
      # volume at the parent. Mount the parent and let the image create the
      # version subdirectory inside it. The pre-18 path (/var/lib/postgresql/data)
      # starts fine but writes to an anonymous volume, so the data disappears on
      # the next `docker compose down`.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-emp_user} -d ${POSTGRES_DB:-event_management_platform}
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
